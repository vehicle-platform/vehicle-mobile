name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.5

      # vehicle_defs (BLE packet layout, D-061) is a path dependency generated
      # from the external/vehicle-defs submodule.
      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      # D-003/D-036: consumers pin defs to a release tag, never a branch commit.
      # Last, so analyze and test still report on a commit pin before the tag.
      - name: Defs pin must be a release tag
        run: |
          git -C external/vehicle-defs fetch --quiet --depth=1 origin '+refs/tags/*:refs/tags/*'
          tag=$(git -C external/vehicle-defs tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          test -n "$tag" || { echo "::error::external/vehicle-defs is not pinned to a vX.Y.Z release tag"; exit 1; }
          echo "defs pin: $tag"

  build-apk:
    needs: flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false

      # The runner image's default JDK moved to 25, which Gradle 8.14 rejects; pin the JDK.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.5

      - run: flutter pub get

      # Release build signed with the default DEBUG key (android/app/build.gradle.kts
      # points the release signingConfig at signingConfigs.debug). Good enough for
      # workshop/field testing only: anyone can re-sign such an APK, so a real
      # release keystore (from secrets, never committed) is needed before any
      # distribution. The artifact name says so.
      - run: flutter build apk --release

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vehicle-mobile-apk-debug-signed
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  # D-121 item 3: the computer client. Built with the /app/ base href because
  # vehicle-server serves the web build at /app (VEHICLE_WEB_APP_DIR).
  build-web:
    needs: flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.5

      - run: flutter pub get

      - run: flutter build web --release --base-href /app/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vehicle-mobile-web
          path: build/web
          retention-days: 14

  # Aggregate required check (QUALITY CI-4): one stable name for the ruleset.
  # `skipped` counts as OK; `failure` and `cancelled` fail it.
  ci-ok:
    if: always()
    needs: [flutter, build-apk, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Every needed job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
