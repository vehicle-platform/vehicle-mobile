name: vehicle_mobile
description: "vehicle-platform phone companion app (BLE telemetry client, ride history, settings)."
publish_to: 'none'
version: 0.5.0+6 # semver (D-036); +N = Android versionCode, bump on every release

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.6
  flutter_blue_plus: ^1.31.0
  permission_handler: ^11.3.1
  http: ^1.2.1
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  share_plus: ^7.2.2
  wakelock_plus: ^1.2.8
  archive: ^3.6.1
  connectivity_plus: ^6.0.5
  flutter_secure_storage: ^10.3.4
  vehicle_defs:
    path: external/vehicle-defs/gen/dart/vehicle_defs
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  flutter_local_notifications: ^22.3.3
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/instrument-sans/InstrumentSans-Variable.ttf
    - family: BarlowSemiCondensed
      fonts:
        - asset: assets/fonts/barlow-semi-condensed/BarlowSemiCondensed-Regular.ttf
          weight: 400
        - asset: assets/fonts/barlow-semi-condensed/BarlowSemiCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/barlow-semi-condensed/BarlowSemiCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/barlow-semi-condensed/BarlowSemiCondensed-Bold.ttf
          weight: 700
